name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: telegram-server-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SERVER_VERSION: "10.2"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare environment
        run: |
          REPO_NAME=$(echo ${{ github.repository }} | awk -F '/' '{print tolower($2)}')
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/$REPO_NAME
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.SERVER_VERSION }}
            ${{ env.IMAGE_NAME }}:10

      - name: Verify published server version
        run: |
          version=$(docker run --quiet --rm ${{ env.IMAGE_NAME }}:${SERVER_VERSION} --version 2>&1)
          test "${version}" = "Bot API ${SERVER_VERSION}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Kube Config
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube/
          echo "${KUBECONFIG_CONTENT}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy and verify
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_FILES_SERVE_HOST: ${{ secrets.TELEGRAM_FILES_SERVE_HOST }}
        run: |
          helm upgrade telegram-server ./helm \
            --namespace telegram-server \
            --create-namespace \
            --values helm/values.yaml \
            --set-string=envSecrets.TELEGRAM_API_ID="${TELEGRAM_API_ID}" \
            --set-string=envSecrets.TELEGRAM_API_HASH="${TELEGRAM_API_HASH}" \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0]'="${TELEGRAM_FILES_SERVE_HOST}" \
            --set 'ingress.tls[0].hosts[0]'="${TELEGRAM_FILES_SERVE_HOST}" \
            --atomic \
            --timeout 10m \
            --history-max 10
          kubectl -n telegram-server rollout status deployment/telegram-server --timeout=10m
          test "$(kubectl -n telegram-server exec deployment/telegram-server -c telegram-server -- telegram-bot-api --version)" = "Bot API 10.2"
