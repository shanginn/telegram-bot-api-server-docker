name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: telegram-server-production
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  SERVER_VERSION: "10.2"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.SERVER_VERSION }}-${{ matrix.suffix }}

      - name: Verify published architecture image
        run: |
          version=$(docker run --quiet --rm "${IMAGE_NAME}:${SERVER_VERSION}-${{ matrix.suffix }}" --version 2>&1)
          test "${version}" = "Bot API ${SERVER_VERSION}"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${SERVER_VERSION}" \
            --tag "${IMAGE_NAME}:10" \
            "${IMAGE_NAME}:${SERVER_VERSION}-amd64" \
            "${IMAGE_NAME}:${SERVER_VERSION}-arm64"
          manifest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${SERVER_VERSION}")
          grep -q 'linux/amd64' <<<"${manifest}"
          grep -q 'linux/arm64' <<<"${manifest}"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Kube Config
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube/
          echo "${KUBECONFIG_CONTENT}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy and verify
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_FILES_SERVE_HOST: ${{ secrets.TELEGRAM_FILES_SERVE_HOST }}
        run: |
          helm upgrade telegram-server ./helm \
            --namespace telegram-server \
            --create-namespace \
            --values helm/values.yaml \
            --set-string=envSecrets.TELEGRAM_API_ID="${TELEGRAM_API_ID}" \
            --set-string=envSecrets.TELEGRAM_API_HASH="${TELEGRAM_API_HASH}" \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0]'="${TELEGRAM_FILES_SERVE_HOST}" \
            --set 'ingress.tls[0].hosts[0]'="${TELEGRAM_FILES_SERVE_HOST}" \
            --atomic \
            --timeout 10m \
            --history-max 10
          kubectl -n telegram-server rollout status deployment/telegram-server --timeout=10m
          test "$(kubectl -n telegram-server exec deployment/telegram-server -c telegram-server -- telegram-bot-api --version)" = "Bot API 10.2"
